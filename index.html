<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Chomutovka – průvodce centrem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mobilní aplikace v jednom sloupci (max 480 px) — horní lišta "Jste zde", 5 záložek dole, spodní panely (sheet) pro detail. */
/* BRAND: barvy Chomutovky jsou zatím provizorní — po dodání loga stačí přepsat --brand a --accent. */
:root{
  --bg:#e9edf1; --app:#f4f6f8; --surface:#ffffff; --surface-2:#eef2f5; --ink:#13202a; --muted:#5a6671; --faint:#86929c; --line:#e0e5ea;
  --brand:#0b6e91; --brand-deep:#064760; --brand-soft:#e1eff5; --on-brand:#ffffff;
  --accent:#f2a516; --accent-soft:#fdf0d5; --on-accent:#231703;
  --ok:#1b8749; --ok-soft:#dff2e6; --off:#c0392f; --off-soft:#fbe3e1; --warn:#a96200; --warn-soft:#fdeed5;
  --walk:#f7f9fb; --wall:#c3ccd5; --atr:#d7eaf2; --atr-line:#9cc7d8;
  --shadow:0 1px 2px rgba(15,32,44,.05),0 6px 20px rgba(15,32,44,.07);
  --shadow-up:0 -6px 24px rgba(15,32,44,.10);
  --c-jidlo:#fde3cf; --i-jidlo:#9a4815; --c-potraviny:#dcefd0; --i-potraviny:#376b1d; --c-moda:#fadbe7; --i-moda:#982b55;
  --c-obuv:#e6e0f8; --i-obuv:#5542a3; --c-sport:#d6f0e6; --i-sport:#1d6f4e; --c-kosmetika:#f0ddf6; --i-kosmetika:#82349b;
  --c-darky:#fbecc4; --i-darky:#7d5b00; --c-hracky:#ffe1d6; --i-hracky:#a64124; --c-elektro:#d9e9f9; --i-elektro:#215894;
  --c-sluzby:#e4e9ee; --i-sluzby:#45535f;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --num:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070c10; --app:#0d1419; --surface:#151f26; --surface-2:#1c2830; --ink:#ecf1f4; --muted:#a1adb7; --faint:#7b8893; --line:#25323b;
  --brand:#46aed5; --brand-deep:#0b3a4c; --brand-soft:#123241; --on-brand:#04202b;
  --accent:#f6b740; --accent-soft:#3a2d12; --on-accent:#231703;
  --ok:#4fc483; --ok-soft:#113022; --off:#f06e66; --off-soft:#3b1a18; --warn:#f0a94a; --warn-soft:#3a2810;
  --walk:#182229; --wall:#33424d; --atr:#123241; --atr-line:#2b6680;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --shadow-up:0 -6px 24px rgba(0,0,0,.4);
  --c-jidlo:#3d2617; --i-jidlo:#f2b48a; --c-potraviny:#1f3317; --i-potraviny:#a7d78d; --c-moda:#3b1c28; --i-moda:#f0a3c0;
  --c-obuv:#26213f; --i-obuv:#bcb0f2; --c-sport:#15342a; --i-sport:#8fd9b9; --c-kosmetika:#31203a; --i-kosmetika:#dcaaea;
  --c-darky:#3a3015; --i-darky:#ecd08a; --c-hracky:#3d2219; --i-hracky:#f5ad95; --c-elektro:#172b40; --i-elektro:#9cc4ef;
  --c-sluzby:#222c34; --i-sluzby:#b3c0cb; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#070c10; --app:#0d1419; --surface:#151f26; --surface-2:#1c2830; --ink:#ecf1f4; --muted:#a1adb7; --faint:#7b8893; --line:#25323b;
  --brand:#46aed5; --brand-deep:#0b3a4c; --brand-soft:#123241; --on-brand:#04202b;
  --accent:#f6b740; --accent-soft:#3a2d12; --on-accent:#231703;
  --ok:#4fc483; --ok-soft:#113022; --off:#f06e66; --off-soft:#3b1a18; --warn:#f0a94a; --warn-soft:#3a2810;
  --walk:#182229; --wall:#33424d; --atr:#123241; --atr-line:#2b6680;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --shadow-up:0 -6px 24px rgba(0,0,0,.4);
  --c-jidlo:#3d2617; --i-jidlo:#f2b48a; --c-potraviny:#1f3317; --i-potraviny:#a7d78d; --c-moda:#3b1c28; --i-moda:#f0a3c0;
  --c-obuv:#26213f; --i-obuv:#bcb0f2; --c-sport:#15342a; --i-sport:#8fd9b9; --c-kosmetika:#31203a; --i-kosmetika:#dcaaea;
  --c-darky:#3a3015; --i-darky:#ecd08a; --c-hracky:#3d2219; --i-hracky:#f5ad95; --c-elektro:#172b40; --i-elektro:#9cc4ef;
  --c-sluzby:#222c34; --i-sluzby:#b3c0cb; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--app);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){ .app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.12)} }
.view{padding-inline:16px;padding-block:14px 8px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-size:18px}
.link{background:none;border:0;padding:4px 0;color:var(--brand);font-weight:700;font-size:13.5px}
.muted{color:var(--muted)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* horní lišta */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;min-width:0}
.logo img{height:30px;width:auto;max-width:170px;display:block}
.logo .word{font:700 21px var(--display);color:var(--brand);letter-spacing:-.02em}
.bar-r{display:flex;gap:6px;align-items:center}
.ibtn{height:38px;min-width:38px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:12.5px}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.here{display:flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--ink);border:0;border-radius:99px;padding:5px 10px 5px 9px;font-size:13px;min-width:0;max-width:66%}
.here .lbl{color:var(--muted);white-space:nowrap}
.here b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.here .i{width:15px;height:15px;color:var(--muted)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}
.opill{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.opill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.opill.on{color:var(--ok)} .opill.part{color:var(--warn)} .opill.off{color:var(--off)}

/* spodní záložky */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--faint);font-size:11px;font-weight:700;position:relative;border-radius:12px}
.tab .ico{width:44px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .ico{background:var(--brand-soft)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 10px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:10px;display:grid;place-items:center;font-weight:800}
.tab .badge.dot{min-width:9px;width:9px;height:9px;padding:0;top:6px;background:var(--ok)}

/* společné prvky */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;border-radius:14px;padding:12px 16px;border:1px solid transparent;text-decoration:none;min-height:46px}
.btn .i{width:18px;height:18px}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:16px;border-radius:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-weight:700;font-size:13px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--app);border-color:var(--ink)}
.chip .sw{width:9px;height:9px;border-radius:3px}
.fl{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.st{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.on{color:var(--ok)} .st.off{color:var(--off)}
.tag-demo{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 6px}
.input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.cat-badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:700 14px var(--num);flex:none}
.c-jidlo{--cb:var(--c-jidlo);--ci:var(--i-jidlo)} .c-potraviny{--cb:var(--c-potraviny);--ci:var(--i-potraviny)} .c-moda{--cb:var(--c-moda);--ci:var(--i-moda)}
.c-obuv{--cb:var(--c-obuv);--ci:var(--i-obuv)} .c-sport{--cb:var(--c-sport);--ci:var(--i-sport)} .c-kosmetika{--cb:var(--c-kosmetika);--ci:var(--i-kosmetika)}
.c-darky{--cb:var(--c-darky);--ci:var(--i-darky)} .c-hracky{--cb:var(--c-hracky);--ci:var(--i-hracky)} .c-elektro{--cb:var(--c-elektro);--ci:var(--i-elektro)} .c-sluzby{--cb:var(--c-sluzby);--ci:var(--i-sluzby)}
.cat-badge{background:var(--cb);color:var(--ci)}

/* DOMŮ */
.hero{background:var(--brand-deep);color:#fff;border-radius:22px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);pointer-events:none}
.hero .greet{font-size:13.5px;color:#cfe4ec;font-weight:600}
.hero h1{font-size:25px;line-height:1.15;color:#fff}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;color:#4f5c66;border:0;border-radius:14px;padding:14px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.searchbtn .i{color:#0b6e91}
.hero .chips .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.smart{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.smart .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--warn)}
.smart.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
.smart.warn .si{background:var(--surface);color:var(--warn)}
.smart b{display:block;font-size:15px}
.smart span{font-size:13px;color:var(--muted)}
.smart > .i{color:var(--faint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px;min-width:0}
.tile .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tile b{font:700 15px var(--body)}
.tile span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .meter{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:auto}
.tile .meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tile.live .ti{background:var(--ok-soft);color:var(--ok)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.mini-cpn{flex:0 0 72%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;text-align:left;padding:0}
.mini-cpn .off{background:var(--cb);color:var(--ci);font:700 20px var(--display);display:grid;place-items:center;width:84px;flex:none;text-align:center;padding:6px}
.mini-cpn .tx{padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-cpn .tx b{font-size:14px}
.mini-cpn .tx span{font-size:12.5px;color:var(--muted)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info button,.info div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;gap:10px;align-items:flex-start;min-width:0}
.info .i{color:var(--brand);margin-top:1px}
.info b{display:block;font-size:14px}
.info span{font-size:12px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-decoration:none}
.rate .stars{color:var(--accent);display:flex}
.rate .stars .i{width:16px;height:16px;fill:currentColor;stroke:none}
.foot{font-size:12px;color:var(--faint);text-align:center;padding-block:4px 8px}

/* OBCHODY */
.search-wrap{position:sticky;top:var(--top-h,88px);z-index:10;background:var(--app);margin-inline:-16px;padding:10px 16px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid transparent}
.sfield{position:relative}
.sfield .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sfield .input{padding-left:42px;padding-right:42px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sfield .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:active{background:var(--surface-2)}
.item .nm{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ds{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .rt .ln{display:flex;gap:6px;align-items:center}
.res-h{font-size:13px;color:var(--muted);font-weight:600}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* PLÁNEK */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:11px;padding:9px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rhead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.rhead b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead span{font-size:12.5px;color:var(--muted)}
.rnums{display:flex;gap:18px}
.rnums div{display:flex;flex-direction:column}
.rnums b{font:700 20px var(--num);font-variant-numeric:tabular-nums}
.rnums span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.xbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px 14px}
.planbox{position:relative;width:100%;aspect-ratio:360/320;max-width:100%;border-radius:20px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
#planSvg,#planSvg svg{width:100%;height:100%;display:block}
.floors{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.floors button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:800 13px var(--num);box-shadow:var(--shadow);position:relative;color:var(--ink)}
.floors button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.floors button .rdot{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.zoom button{width:40px;height:38px;border:0;background:var(--surface);display:grid;place-items:center;border-top:1px solid var(--line)}
.zoom button:first-child{border-top:0}
.nextfloor{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;border-radius:99px;padding:9px 14px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);white-space:nowrap}
.floorname{position:absolute;right:12px;top:12px;font:700 12px var(--num);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--muted)}
svg .bld{fill:var(--walk);stroke:var(--wall);stroke-width:3}
svg .atr{fill:var(--atr);stroke:var(--atr-line);stroke-width:1.2;stroke-dasharray:5 4}
svg .atl{fill:var(--atr-line);font:800 7px var(--body);letter-spacing:.2em;text-anchor:middle}
svg .esc rect{fill:var(--surface);stroke:var(--atr-line);stroke-width:1.2}
svg .esc path{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg .room rect{fill:var(--cb);stroke:var(--surface);stroke-width:2}
svg .room text{fill:var(--ci);font:800 6.8px var(--body);text-anchor:middle;letter-spacing:.02em;pointer-events:none}
svg .room{cursor:pointer}
svg .room.hi rect{stroke:var(--accent);stroke-width:3}
svg .room.dim{opacity:.45}
svg .poi circle{fill:var(--surface);stroke:var(--brand);stroke-width:1.4}
svg .poi text{fill:var(--brand);font:800 5.6px var(--body);text-anchor:middle}
svg .door{stroke:var(--walk);stroke-width:6}
svg .dlbl{fill:var(--muted);font:800 7px var(--body);text-anchor:middle;letter-spacing:.12em}
svg .park rect{fill:var(--brand-soft);stroke:var(--atr-line);stroke-width:1}
svg .park text{fill:var(--brand);font:800 7.5px var(--body);text-anchor:middle;letter-spacing:.1em}
svg .rt-halo{fill:none;stroke:color-mix(in srgb,var(--accent) 30%,transparent);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
svg .rt{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
svg .rt-dots{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:.1 9;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-9.1}}
svg .me-pulse{fill:var(--brand);opacity:.22;transform-box:fill-box;transform-origin:center;animation:mep 2s ease-out infinite}
@keyframes mep{0%{transform:scale(.6);opacity:.35}100%{transform:scale(1.8);opacity:0}}
svg .me-dot{fill:var(--brand);stroke:var(--surface);stroke-width:2.5}
svg .pin path{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
svg .pin circle{fill:var(--surface)}
svg .escb rect{fill:var(--accent)}
svg .escb text{fill:var(--on-accent);font:800 6.5px var(--body);text-anchor:middle}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--cb)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.steps li.on .si{background:var(--brand-soft);color:var(--brand)}
.steps li.end .si{background:var(--accent-soft);color:var(--warn)}
.steps li button{all:unset;cursor:pointer}
.steps .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tourbox{width:100%;aspect-ratio:3/4;max-height:62vh;border-radius:20px;overflow:hidden;background:var(--brand-deep);border:1px solid var(--line)}
.tourbox iframe{width:100%;height:100%;border:0;display:block}
.tour-fb{height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:20px;color:#fff;background:linear-gradient(160deg,var(--brand),var(--brand-deep))}
.tour-fb h3{font-size:22px;color:#fff}
.tour-fb p{margin:0;color:#d4e8ef;font-size:14px}
.tstat{font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 2px 0}

/* PARKOVÁNÍ */
.park-hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.park-hero .pi{width:52px;height:52px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.park-hero .pi .i{width:28px;height:28px}
.park-hero h2{font-size:22px}
.park-hero p{margin:0;color:var(--muted)}
.ring{position:relative;width:220px;height:220px;max-width:100%;margin:4px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--surface-2);stroke-width:14}
.ring .fg{fill:none;stroke:var(--ok);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .9s linear, stroke .3s}
.ring.warn .fg{stroke:var(--warn)} .ring.paid .fg{stroke:var(--brand)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.ring .ctr span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.ring .ctr b{font:700 44px var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay div{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.pay b{font:700 18px var(--num);font-variant-numeric:tabular-nums}
.pay span{font-size:12px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14px;background:none;border:0;padding:4px 0;width:100%;text-align:left}
.switch .tg{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] .tg{background:var(--ok)}
.switch[aria-checked="true"] .tg::after{transform:translateX(18px)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;font-size:14px}
.rules li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);margin-top:8px;flex:none}
.spot{font-size:13px;color:var(--muted);text-align:center}

/* AKCE */
.hunt{background:var(--brand-deep);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hunt h2{font-size:20px;color:#fff}
.hunt p{margin:0;color:#cfe4ec;font-size:14px}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center;color:rgba(255,255,255,.45)}
.stamp.got{border:0;background:var(--accent);color:var(--on-accent);animation:pop .4s ease-out}
.stamp .i{width:18px;height:18px}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.reward{background:#fff;color:#13202a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.reward code{font:800 20px var(--display);letter-spacing:.06em;color:#064760}
.cpn{display:grid;grid-template-columns:96px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cpn .off{background:var(--cb);color:var(--ci);font:700 22px var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;gap:2px;border-right:2px dashed var(--surface)}
.cpn .off small{font:700 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.cpn .tx{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cpn .tx b{font-size:15px}
.cpn .tx span{font-size:12.5px;color:var(--muted)}
.cpn .tx .btn{min-height:38px;padding:8px 12px;font-size:13.5px;align-self:flex-start}
.cpn.used{opacity:.6}
.evt{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.evt .dt{background:var(--brand-soft);color:var(--brand);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:8px 0;line-height:1.1}
.evt .dt b{font:700 22px var(--num)}
.evt .dt span{font-size:11px;font-weight:800;text-transform:uppercase}
.evt b.t{display:block}
.evt span.s{font-size:12.5px;color:var(--muted)}

/* SHEET */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(6,16,22,.45);animation:fade .2s}
.sheet{position:relative;width:min(480px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-up);animation:up .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.sheet.half{max-height:52vh}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sh-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.sh-head h2{font-size:20px}
.sh-head .meta{font-size:13px;color:var(--muted)}
.kv{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;user-select:all}
.menu{display:flex;flex-direction:column}
.menu button,.menu a{display:flex;align-items:center;gap:14px;padding:13px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;text-decoration:none;font-weight:600;font-size:15px}
.menu button:first-child{border-top:0}
.menu .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand)}
.menu small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tagbtn{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;min-width:0}
.tagbtn .i{color:var(--brand)}
.tagbtn.cur{border-color:var(--brand);background:var(--brand-soft)}
.tagbtn small{display:block;font-weight:600;color:var(--warn);font-size:11.5px}
.code{font:800 34px var(--num);letter-spacing:.08em;text-align:center;color:var(--brand);background:var(--brand-soft);border-radius:18px;padding:18px 10px}
.timer{text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
textarea.input{resize:vertical;min-height:84px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--app);font-weight:700;font-size:14px;border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(440px,calc(100% - 32px));display:flex;gap:10px;align-items:center;animation:up .25s}
.toast .i{color:var(--accent)}

/* FOTKY A PRÉMIOVÉ KARTY */
.ph{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--cb,var(--brand-soft)) 0%,color-mix(in srgb,var(--ci,var(--brand)) 30%,var(--cb,var(--brand-soft))) 100%)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font:600 22px var(--display);color:var(--ci,var(--brand));letter-spacing:.02em}
.ph-wrap{position:relative}
.r16x10{aspect-ratio:16/10}.r2x1{aspect-ratio:2/1}.r21x9{aspect-ratio:21/9}
.thumb{width:56px;height:56px;border-radius:16px;flex:none}
.thumb .ini{font-size:17px}
.hero2{position:relative;margin:-14px -16px 0;min-height:340px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 16px 18px;gap:12px;overflow:hidden;background:#0b2631}
.hero2 > .ph{position:absolute;inset:0;background:linear-gradient(160deg,#0f4b62,#06222d)}
.hero2::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,16,22,.05) 0%,rgba(4,16,22,.25) 35%,rgba(4,16,22,.88) 100%);pointer-events:none}
.hero2 > *:not(.ph){position:relative;z-index:1}
.hero2 .greet{font-size:13.5px;color:#e3eef2;font-weight:600;display:flex;align-items:center;gap:6px}
.hero2 h1{font:600 36px/1.02 var(--display);color:#fff;letter-spacing:-.02em}
.hero2 .chips .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
.dcard{flex:0 0 80%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dbadge{position:absolute;left:12px;top:12px;z-index:1;background:var(--accent);color:var(--on-accent);font:800 15px var(--body);border-radius:11px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.dbadge.big{font-size:18px;padding:8px 12px}
.dcard .bd,.cp .bd,.ev .bd{padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.dcard b.dt{font:600 18px/1.2 var(--display)}
.shopline{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;display:flex;gap:6px;align-items:center}
.price{display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.price b{font:800 19px var(--body);color:var(--ink)}
.price s{color:var(--faint);font-size:13.5px}
.valid{font-size:12px;color:var(--muted)}
.cp{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.cp h3,.ev h3{font:600 21px/1.2 var(--display)}
.cond{margin:2px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.cond li{display:flex;gap:6px}
.cond li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--faint);margin-top:7px;flex:none}
.perf{position:relative;border-top:2px dashed var(--line);margin:8px -15px 4px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--app);border:1px solid var(--line)}
.perf::before{left:-11px}.perf::after{right:-11px}
.cp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:13.5px;border-radius:12px;white-space:nowrap}
.cp.used .ph img{filter:grayscale(1) opacity(.6)}
.usedmark{position:absolute;right:12px;top:12px;z-index:1;background:var(--surface);color:var(--ok);font-weight:800;font-size:12.5px;border-radius:10px;padding:5px 9px;display:flex;gap:4px;align-items:center}
.usedmark .i{width:15px;height:15px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.datechip{position:absolute;left:12px;bottom:-18px;z-index:1;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;padding:6px 10px;line-height:1.05;min-width:52px}
.datechip b{font:700 22px var(--num);color:var(--ink)}
.datechip span{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--brand)}
.ev .bd{padding-top:24px}
.sh-hero{position:relative;margin:-10px -16px 0;height:210px;border-radius:24px 24px 0 0;overflow:hidden;flex:none}
.sh-hero .ph{position:absolute;inset:0}
.sh-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(4,14,20,.78) 100%);pointer-events:none}
.sh-hero .xbtn{position:absolute;right:12px;top:12px;z-index:2;background:rgba(255,255,255,.92);border:0;color:#13202a}
.sh-hero .tx{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#fff;display:flex;flex-direction:column;gap:2px}
.sh-hero .tx span{font-size:12.5px;font-weight:700;color:#dbe7ec}
.sh-hero .tx h2{font:600 26px/1.1 var(--display);color:#fff}
.sh-hero .grab2{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.7);z-index:2}
.bcbox{background:#fff;border-radius:18px;padding:16px 14px 10px;border:1px solid var(--line)}
.bc{width:100%;height:96px;display:block}
.codetx{font:800 22px var(--num);letter-spacing:.12em;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.park-ph{margin:-18px -18px 0;border-radius:22px 22px 0 0;overflow:hidden}
.hero2 .here-mini{display:inline-flex;align-items:center;gap:6px}

/* VEDENÍ */
.mg-head{display:flex;align-items:center;gap:12px}
.mg-head h1{font-size:21px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.kpi b{font:700 26px var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;font-weight:800;color:var(--ok)}
.hours{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:18px}
.hours div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.hours i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--brand) 35%,var(--surface-2))}
.hours div.pk i{background:var(--brand)}
.hours small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hours div.pk b{font-size:11px;color:var(--brand);font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.hbar .tr{grid-column:1 / -1;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:9px;background:var(--brand)}
.hbar.miss .tr i{background:var(--accent)}
.hbar b{font-variant-numeric:tabular-nums;font-weight:700}
.hbar .new{font-size:10.5px;font-weight:800;color:var(--ok);background:var(--ok-soft);border-radius:5px;padding:1px 5px;margin-left:6px}
.insight{display:flex;gap:10px;background:var(--accent-soft);border-radius:14px;padding:12px;font-size:13.5px}
.insight .i{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;padding:0 0 8px}
.tbl td{padding:9px 0;border-top:1px solid var(--line)}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right;padding-left:8px}
.tblwrap{overflow-x:auto}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.trio b{font:700 18px var(--num);font-variant-numeric:tabular-nums}
.trio span{font-size:11.5px;color:var(--muted)}
.prob{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.prob:first-child{border-top:0}
.prob small{color:var(--muted)}
.pill{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.new{background:var(--accent-soft);color:var(--warn)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-shops" hidden></section>
    <section class="view" id="v-map" hidden></section>
    <section class="view" id="v-park" hidden></section>
    <section class="view" id="v-deals" hidden></section>
    <section class="view" id="v-mgmt" hidden></section>
  </main>
  <nav class="tabs" id="tabs" aria-label="Hlavní menu"></nav>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="scrim" data-act="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>

function nearestOnRing(cx,cy){
  let best = null;
  RING.forEach((a,i) => {
    const b = RING[(i+1)%RING.length], dx = b[1]-a[1], dy = b[2]-a[2];
    let tt = ((cx-a[1])*dx + (cy-a[2])*dy) / (dx*dx+dy*dy); tt = Math.max(0,Math.min(1,tt));
    const x = a[1]+tt*dx, y = a[2]+tt*dy, dd = Math.hypot(cx-x,cy-y);
    if (!best || dd < best.dd) best = {i,t:tt,x,y,dd};
  });
  return best;
}

/* čárový kód EAN-13 pro uplatnění na pokladně */
const EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R = EAN_L.map(x => x.split('').map(c => c === '0' ? '1' : '0').join(''));
const EAN_P = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function barcodeSVG(d12){
  const ds = d12.split('').map(Number), ck = (10 - ds.reduce((a,v,i) => a + v*(i%2 ? 3 : 1), 0) % 10) % 10, all = d12 + ck;
  let bits = '101'; const par = EAN_P[+all[0]];
  for (let i=1;i<=6;i++) bits += par[i-1] === 'L' ? EAN_L[+all[i]] : EAN_G[+all[i]];
  bits += '01010'; for (let i=7;i<=12;i++) bits += EAN_R[+all[i]]; bits += '101';
  let r = '', x = 0;
  while (x < bits.length){ if (bits[x] === '1'){ let w = 1; while (bits[x+w] === '1') w++; r += `<rect x="${x}" y="0" width="${w}" height="56"/>`; x += w; } else x++; }
  return {svg:`<svg class="bc" viewBox="0 0 ${bits.length} 56" preserveAspectRatio="none" role="img" aria-label="Čárový kód ${all}"><g fill="#111">${r}</g></svg>`, all};
}

/* ================= TRASY ================= */
let DJ = null, DJfrom = null;
function dj(){
  if (DJfrom === here) return DJ;
  const dist = {}, prev = {}, todo = new Set(Object.keys(N));
  todo.forEach(k => dist[k] = Infinity); dist[here] = 0;
  while (todo.size){
    let u = null, best = Infinity; todo.forEach(k => { if (dist[k] < best){ best = dist[k]; u = k; } });
    if (u === null) break; todo.delete(u);
    G[u].forEach(([v,w,ty]) => { const nd = dist[u]+w; if (nd < dist[v]){ dist[v] = nd; prev[v] = [u,ty]; } });
  }
  DJ = {dist, prev}; DJfrom = here; return DJ;
}
function route(t){
  const {prev} = dj(), path = [], types = []; let c = t;
  while (c && c !== here){ path.unshift(c); types.unshift(prev[c] ? prev[c][1] : null); c = prev[c] && prev[c][0]; }
  path.unshift(here); return {path, types};
}
function walkMeters(r){ let m = 0; for (let i=1;i<r.path.length;i++) if (r.types[i-1] !== 'esc') m += dxy(r.path[i-1], r.path[i]); return Math.max(r.path.length > 1 ? 2 : 0, Math.round(m*M_PER_UNIT)); }
function minutes(r){ return Math.max(1, Math.round(walkMeters(r)/1.2/60 + r.types.filter(x => x === 'esc').length*0.4)); }
function buildSteps(r, tp){
  const out = []; let acc = 0;
  const lastEsc = r.types.lastIndexOf('esc'), tgt = r.path[r.path.length-1];
  for (let i=1;i<r.path.length;i++){
    const a = r.path[i-1], b = r.path[i], ty = r.types[i-1];
    if (ty === 'esc'){
      let j = i; while (j+1 < r.path.length && r.types[j] === 'esc') j++;
      const to = N[r.path[j]][2], up = to > N[a][2];
      if (acc > 0){ out.push({ic:'walk', tx:t('walkToEsc'), m:acc, f:N[a][2]}); acc = 0; }
      out.push({ic:up?'up':'down', tx:t(up?'escUp':'escDown', t('floor'+to)), f:N[a][2]});
      i = j; continue;
    }
    acc += dxy(a,b)*M_PER_UNIT;
  }
  if (acc > 0){
    const passed = r.path.slice(lastEsc+2, -1).filter(k => k.startsWith('d_') && byId[k.slice(2)] && byId[k.slice(2)].node !== tgt && k !== tgt && !k.startsWith('d_atm')).map(k => byId[k.slice(2)].name);
    out.push({ic:'walk', tx: passed.length ? t('walkPast', passed.slice(-2).join(', ')) : t('walkTo'), m:acc, f:N[tgt][2]});
  }
  out.push({ic:'flag', tx:t('arrive', tp.name), f:N[tgt][2], end:true});
  out.forEach(s => { if (s.m) s.m = Math.max(2, Math.round(s.m)); });
  return out;
}

const DAYI = {'Po':0,'Út':1,'St':2,'Čt':3,'Pá':4,'So':5,'Ne':6};
function isOpen(hours, now = new Date()){
  if (!hours) return null;
  const wd = (now.getDay()+6)%7, h = now.getHours()+now.getMinutes()/60;
  const tm = s => { const [hh,mm] = s.split(':'); return +hh + (mm ? +mm/60 : 0); };
  return hours.split(', ').some(part => {
    const m = part.match(/^(\S+)\s+([\d:]+)–([\d:]+)$/); if (!m) return false;
    const [a,b] = m[1].split('–'), from = DAYI[a], to = b ? DAYI[b] : DAYI[a];
    return wd >= from && wd <= to && h >= tm(m[2]) && h < tm(m[3]);
  });
}
function fmtHours(h){
  if (!h || lang === 'cs') return h;
  const map = {de:{Po:'Mo',Út:'Di',St:'Mi',Čt:'Do',Pá:'Fr',So:'Sa',Ne:'So'},uk:{Po:'Пн',Út:'Вт',St:'Ср',Čt:'Чт',Pá:'Пт',So:'Сб',Ne:'Нд'}}[lang];
  return h.replace(/Po|Út|St|Čt|Pá|So|Ne/g, d => map[d]);
}
function centerStatus(){
  const h = new Date().getHours() + new Date().getMinutes()/60;
  if (h >= 9 && h < 19) return {cls:'on', text:t('openNow')};
  if (h >= 7 && h < 20) return {cls:'part', text:t('partOpen')};
  return {cls:'off', text:t('closedNow')};
}

const isWeekend = d => [0,6].includes(d.getDay());
function parkPrice(m){ if (m <= 60) return 0; if (m <= 120) return 10; return 10 + 30*Math.ceil((m-120)/60); }
function parkState(){
  if (!parking) return null;
  const now = new Date(), m = (now - parking.start)/60000, wk = isWeekend(now);
  const price = wk ? 0 : parkPrice(m);
  const b = m <= 60 ? 60 : m <= 120 ? 120 : 120 + 60*Math.ceil((m-120)/60);
  return {m, wk, price, freeLeft:Math.max(0, 60-m), nextIn:Math.max(1, Math.ceil(b-m)), nextPrice:parkPrice(b+0.01)};
}
const mmss = min => { const s = Math.max(0, Math.round(min*60)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const hmm = min => { const s = Math.floor(min); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

/* ================= HLEDÁNÍ ================= */
const STOP = new Set(['pro','na','a','v','do','k','s','se','z','u','the','fur','und','для','i','mi','koupit','kde','chci','hledam']);
function search(query){
  const toks = norm(query).split(/[^a-z0-9а-яіїєґ]+/i).filter(x => x.length >= 2 && !STOP.has(x));
  if (!toks.length) return null;
  return SHOPS.map(p => {
    const nm = norm(p.name), hay = norm(p.kw + ' ' + p.desc + ' ' + catName(p.cat));
    let sc = 0;
    toks.forEach(tk => { const st = tk.length > 5 ? tk.slice(0, tk.length-2) : tk.length > 4 ? tk.slice(0, tk.length-1) : tk; if (nm.includes(st)) sc += 5; else if (hay.split(' ').some(w => w.startsWith(st))) sc += 2; else if (hay.includes(st)) sc += 1; });
    return {p, sc};
  }).filter(x => x.sc > 0).sort((a,b) => b.sc - a.sc).map(x => x.p);
}

    return;
  }
  const sdkOk = SDK_DOMAINS.includes(location.hostname);
  // Na nepovolené doméně se klíč do prohlídky nepřidává, jinak ji Matterport zablokuje a jen se načítá.
  box.innerHTML = `<iframe id="mp" src="${sdkOk ? SDK_URL : TOUR_URL}" allow="fullscreen; xr-spatial-tracking" allowfullscreen title="3D prohlídka Chomutovky"></iframe>`;

      try { sweepGraph = await sdk.Sweep.createGraph(); } catch(e){ sweepGraph = null; }
    } catch(e){ setTourStatus(t('sdkFail')); }
  };
  sc.onerror = () => setTourStatus(t('sdkFail'));
  document.head.appendChild(sc);

const wait = ms => new Promise(r => setTimeout(r, ms));
async function guide(){
  pane = 'tour'; renderMap(false);
  $('#tourPane').scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block:'start'});
  if (!target) return;
  const tp = place(target);
  if (!sdk){ toast(location.protocol === 'file:' ? t('sdkLocal') : t('sdkFail'), 'cube', 4000); return; }
  if (guiding) return;
  const to = sweepMap[tp.node], from = sweepMap[here] || curSweep;
  if (!to){ setTourStatus(t('notMapped')); return; }
  guiding = true;
  try {
    if (from && from !== curSweep){ await sdk.Sweep.moveTo(from, {transition: sdk.Sweep.Transition.INSTANT}); await wait(400); }
    let path = [to];
    if (sweepGraph && from){
      const res = await sdk.Graph.createAStarRunner(sweepGraph, sweepGraph.vertex(from), sweepGraph.vertex(to)).exec();
      if (res && res.path && res.path.length) path = res.path.map(v => v.id);
    }
    setTourStatus(t('guiding', tp.name));
    for (const sid of path){ if (sid === curSweep) continue; await sdk.Sweep.moveTo(sid, {transition: sdk.Sweep.Transition.FLY, transitionTime: 900}); await wait(250); }
    setTourStatus(t('arrived', tp.name));
  } catch(e){
    try { await sdk.Sweep.moveTo(to, {transition: sdk.Sweep.Transition.FLY}); setTourStatus(t('arrived', tp.name)); } catch(e2){ setTourStatus(t('sdkFail')); }
  }

function scan(id){

  here = tg.node; logEv('scan', {tag:id}); closeSheet();
  let msg = t('scanned', tg.name);

  toast(msg, tg.stamp ? 'star' : 'nfc');

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  switch (a){
    case 'tab': closeSheet(); if (arg === 'map' && !target) mapFloor = N[here][2]; goTab(arg, {fit: arg === 'map'}); break;
    case 'close': closeSheet(); break;
    case 'gosearch': goTab('shops'); setTimeout(() => $('#q') && $('#q').focus(), 50); break;
    case 'quick': q = arg; shopCat = 'all'; if ($('#q')) $('#q').value = q; goTab('shops'); if ($('#q')){ $('#q').value = q; $('.clr').hidden = false; } { const r = search(q); logEv('search', {q, found:!!(r && r.length)}); } break;
    case 'clearq': q = ''; $('#q').value = ''; el.hidden = true; renderShopList(); $('#q').focus(); break;
    case 'cat': shopCat = arg; if (tab !== 'shops') goTab('shops'); else { renderShopChips(); renderShopList(); } break;
    case 'shop': openShop(arg); break;
    case 'nav': navigateTo(arg); break;
    case 'nav3d': navigateTo(arg, {guide:true}); break;
    case 'atm': navigateTo(nearestAtm()); break;
    case 'floor': mapFloor = +arg; renderMap(true); break;
    case 'pane': pane = arg; renderMap(false); break;
    case 'zin': zoomAt(1/1.35, vb.x+vb.w/2, vb.y+vb.h/2); break;
    case 'zout': zoomAt(1.35, vb.x+vb.w/2, vb.y+vb.h/2); break;
    case 'zfit': animateVB({...BASE}); break;
    case 'cancelroute': target = null; renderMap(true); break;
    case 'guide': guide(); break;
    case 'wifi': copyText(WIFI_PASS, t('copied') + ': ' + WIFI_PASS); break;
    case 'parktype': parkType = arg; el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'parkstart': parking = {start:Date.now(), type:parkType, note:($('#spot').value||'').trim().slice(0,60), remind:true, warned:false}; store.set('parking', parking); logEv('park'); renderTabs(); renderPark(); break;
    case 'parkstop': parking = null; store.set('parking', null); renderTabs(); renderPark(); break;
    case 'remind': parking.remind = !parking.remind; store.set('parking', parking); el.setAttribute('aria-checked', parking.remind); break;
    case 'coupon': openCoupon(arg); break;
    case 'showcode': showCode(arg); break;
    case 'redeem': { const u = store.get('used', {}); u[arg] = Date.now(); store.set('used', u); logEv('redeem', {coupon:arg}); renderTabs(); if (tab === 'deals') renderDeals(); if (tab === 'home') renderHome(); showCode(arg); break; }
    case 'menu': menuSheet(); break;

    case 'report': reportSheet(); break;
    case 'rtype': reportType = arg; el.parentNode.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'mgmt': closeSheet(); goTab('mgmt'); break;
    case 'mgmtback': goTab(prevTab); break;

    case 'reset': store.clear(); store.set('lang', lang); parking = null; here = 'vchod'; target = null; closeSheet(); renderTop(); goTab('home'); toast(t('resetDone')); break;
    case 'admin': closeSheet(); pane = 'tour'; goTab('map'); adminSheet(); break;

      if (!curSweep){ toast('Prohlídka není připojená nebo v ní nestojíte na bodě.', 'alert'); break; }

    case 'jump': { const s = sweepMap[$('#mapSel').value]; if (!s || !sdk){ toast('Tohle místo ještě nemá přiřazený bod.', 'alert'); break; } sdk.Sweep.moveTo(s, {transition: sdk.Sweep.Transition.FLY}).catch(() => toast('Přesun se nepodařil.', 'alert')); break; }
    case 'copymap': copyText(JSON.stringify(sweepMap), 'Nastavení zkopírováno', $('#mapJson')); break;
    case 'loadmap': try { Object.assign(sweepMap, JSON.parse($('#mapJson').value)); store.set('sweeps', sweepMap); adminSheet(); toast('Nastavení načteno'); } catch(err){ toast('Text není platné nastavení. Vložte celý zkopírovaný text.', 'alert'); } break;

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TAGS.some(x => x.id === h)) scan(h); });
window.addEventListener('resize', () => document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px'));

/* ================= ČASOVAČ ================= */
setInterval(() => {
  const ps = parkState();
  if (ps){
    if (tab === 'park') updatePark();
    if (tab === 'home' && $('#tilePark')) $('#tilePark').textContent = ps.wk ? t('qParkWeekend') : ps.freeLeft > 0 ? t('qParkFree', Math.ceil(ps.freeLeft)) : t('qParkPaid', ps.price);
    if (parking.remind && !parking.warned && !ps.wk && ps.freeLeft > 0 && ps.freeLeft <= 10){
      parking.warned = true; store.set('parking', parking); toast(t('remindMsg'), 'bell', 6000);
      try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
    }
  }
}, 1000);
setInterval(() => { renderTop(); }, 60000);

/* ================= START ================= */
(function boot(){
  document.documentElement.lang = lang;
  const h = location.hash.slice(1), tg = TAGS.find(x => x.id === h);
  if (tg) here = tg.node;
  mapFloor = N[here][2];
  renderTop(); goTab('home');
  if (tg){ scan(h); toast(t('welcome') + ' · ' + tg.name, 'nfc'); }
})();
</script>
</body>
</html>
